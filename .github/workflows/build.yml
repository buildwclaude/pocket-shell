name: Build APK

# Builds a debug (self-signed, installable) APK on every push to main, and also
# on-demand from the Actions tab. The APK is attached to a rolling "latest"
# GitHub Release so there's a stable link to open on the phone.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner image ships an Android SDK at $ANDROID_HOME; use its sdkmanager
      # directly (android-actions/setup-android breaks on newer cmdline-tools).
      - name: Install SDK platform 35 + build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PocketShell.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketShell-apk
          path: PocketShell.apk
          if-no-files-found: error

      - name: Publish APK to the "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically built by GitHub Actions from the latest commit on `main`.
            Download **PocketShell.apk** below and install it on your phone.
          files: PocketShell.apk
          make_latest: true
